name: build-class-dump

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "iPhoneOS SDK: $SDK"
          ln -sfn "$SDK" "$THEOS/sdks/iPhoneOS.sdk"
          ls -l "$THEOS/sdks"

      - name: Fetch class-dump sources
        run: |
          git clone --depth 1 https://github.com/okanon/class-dump.ios.git cd-src
          rm -rf cd-src/.git
          # The upstream Makefile links UIKit, which makes iOS treat this CLI as a
          # GUI process and sandbox it away from the filesystem. class-dump only
          # needs Foundation.
          sed -i '' 's/class-dump_FRAMEWORKS = UIKit/class-dump_FRAMEWORKS = Foundation/' cd-src/Makefile
          grep -n 'FRAMEWORKS' cd-src/Makefile

      - name: Install signing tools
        run: |
          brew install ldid dpkg
          ldid -v || ldid --version || true
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          xcodebuild -version || true
          clang --version
          echo "THEOS=$THEOS"

      - name: Build package
        run: |
          cd cd-src
          make package FINALPACKAGE=1 THEOS="$THEOS" 2>&1 | tail -40
          echo "--- packages ---"
          ls -la packages/

      - name: Repackage for roothide (iphoneos-arm64e)
        run: |
          cd cd-src/packages
          set -e
          SRC="$(ls class-dump_*.deb | head -1)"
          echo "source: $SRC"
          rm -rf pkgroot
          dpkg-deb -R "$SRC" pkgroot
          echo "--- control before ---"
          cat pkgroot/DEBIAN/control
          # roothide devices are iphoneos-arm64e; the upstream control file says
          # iphoneos-arm, which is the rootful arch and cannot be installed
          # without --force-architecture.
          sed -i '' 's/^Architecture:.*/Architecture: iphoneos-arm64e/' pkgroot/DEBIAN/control
          sed -i '' 's/^Depends:.*/Depends: firmware (>= 15.0), roothide/' pkgroot/DEBIAN/control
          echo "--- control after ---"
          cat pkgroot/DEBIAN/control
          OUT="class-dump_3.5.1_iphoneos-arm64e.deb"
          rm -f *.deb
          dpkg-deb -b pkgroot "$OUT"
          dpkg-deb -I "$OUT"
          echo "--- payload ---"
          dpkg-deb -c "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: class-dump-deb
          path: cd-src/packages/*.deb
          if-no-files-found: error
